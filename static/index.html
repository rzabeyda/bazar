<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
<title>Egypt Bazar | Sharm & Hurghada</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root {
  --bg:#0a0a0a; --card:#141414; --card2:#1c1c1c; --border:#252525;
  --accent:#c8a84b; --accent2:#e6c96a; --text:#ffffff; --muted:#666666;
  --green:#3ecf8e; --red:#e05555; --nav-h:72px;
}
html, body { background:#000; min-height:100vh; }
.wrap { max-width:480px; margin:0 auto; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; min-height:100vh; overflow-x:hidden; position:relative; padding-bottom:var(--nav-h); }

/* ── HEADER ── */
.header { position:sticky; top:0; z-index:100; background:rgba(10,10,10,0.95); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-bottom:1px solid var(--border); padding:14px 16px 12px; }
.header-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.logo { font-size:20px; font-weight:800; letter-spacing:-0.3px; }
.logo-em { color:var(--accent); }
.logo-plain { color:var(--text); }
.lang-switcher { display:flex; background:var(--card2); border-radius:20px; border:1px solid var(--border); overflow:hidden; }
.lang-opt { padding:5px 10px; font-size:11px; font-weight:600; color:var(--muted); cursor:pointer; transition:all .2s; border-radius:20px; margin:2px; }
.lang-opt.active { background:var(--accent); color:#000; }

/* SEARCH */
.search-box { position:relative; }
.search-box svg.search-ico { position:absolute; left:13px; top:50%; transform:translateY(-50%); width:17px; height:17px; color:var(--muted); pointer-events:none; }
.search-input { width:100%; background:var(--card2); border:1.5px solid var(--border); border-radius:14px; padding:11px 16px 11px 40px; color:var(--text); font-size:14px; outline:none; transition:border-color .2s; }
.search-input:focus { border-color:var(--accent); }
.search-input::placeholder { color:var(--muted); }

/* ── CITY TABS ── */
.city-tabs { display:flex; gap:8px; padding:12px 16px 0; }
.city-tab { flex:1; padding:9px 8px; border-radius:12px; border:1.5px solid var(--border); background:var(--card2); color:var(--muted); font-size:13px; font-weight:600; text-align:center; cursor:pointer; transition:all .2s; }
.city-tab.active { background:var(--accent); border-color:var(--accent); color:#000; }

/* ── CATEGORIES ── */
.cats-wrap { overflow-x:auto; padding:10px 16px; scrollbar-width:none; }
.cats-wrap::-webkit-scrollbar { display:none; }
.cats { display:flex; gap:7px; }
.cat-btn { display:inline-flex; align-items:center; gap:5px; padding:7px 14px; border-radius:20px; border:1.5px solid var(--border); background:var(--card2); color:var(--muted); font-size:13px; cursor:pointer; transition:all .2s; white-space:nowrap; }
.cat-btn.active { background:var(--accent); border-color:var(--accent); color:#000; font-weight:700; }

/* ── GRID ── */
.listings { padding:4px 12px 16px; display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.card { background:var(--card); border-radius:16px; border:1px solid var(--border); overflow:hidden; cursor:pointer; position:relative; transition:transform .15s; }
.card:active { transform:scale(.97); }
.card-img { width:100%; aspect-ratio:1; background:var(--card2); display:flex; align-items:center; justify-content:center; font-size:40px; overflow:hidden; }
.card-img img { width:100%; height:100%; object-fit:cover; }
.card-body { padding:9px 10px 11px; }
.card-title { font-size:13px; font-weight:600; color:var(--text); margin-bottom:5px; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.card-price { font-size:15px; font-weight:800; color:var(--accent); }
.card-city { font-size:11px; color:var(--muted); margin-top:3px; display:flex; align-items:center; gap:3px; }
.card-badge { position:absolute; top:8px; left:8px; background:rgba(0,0,0,.7); backdrop-filter:blur(6px); border-radius:8px; padding:3px 8px; font-size:11px; font-weight:500; }
.empty { grid-column:1/-1; text-align:center; padding:60px 20px; color:var(--muted); }
.empty-icon { font-size:52px; margin-bottom:14px; }
.empty-txt { font-size:15px; }

/* ── FAB ── */
.fab { position:fixed; bottom:calc(var(--nav-h) + 16px); right:calc(50% - min(240px, 50vw) + 16px); width:54px; height:54px; border-radius:50%; background:linear-gradient(135deg,var(--accent2),var(--accent)); color:#000; font-size:28px; font-weight:300; display:flex; align-items:center; justify-content:center; box-shadow:0 6px 24px rgba(200,168,75,.45); cursor:pointer; z-index:200; border:none; transition:transform .15s; line-height:1; }
.fab:active { transform:scale(.92); }
@media(max-width:480px){ .fab{ right:16px; } }

/* ── BOTTOM NAV ── */
.bottom-nav { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; height:var(--nav-h); background:rgba(20,20,20,0.96); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border-top:1px solid var(--border); border-radius:20px 20px 0 0; display:flex; z-index:150; padding:0 8px; }
.nav-item { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; cursor:pointer; color:var(--muted); font-size:10px; font-weight:600; padding-bottom:6px; border-radius:14px; transition:color .2s; margin:6px 4px 0; }
.nav-item.active { color:var(--accent); }
.nav-icon { width:26px; height:26px; display:flex; align-items:center; justify-content:center; }
.nav-icon svg { width:24px; height:24px; }

/* ── PAGES ── */
.page { display:none; }
.page.active { display:block; }

/* ── AUCTION ── */
.auction-page { padding:60px 20px; text-align:center; }
.coming-icon { font-size:72px; margin-bottom:20px; }
.coming-title { font-size:24px; font-weight:800; margin-bottom:10px; }
.coming-sub { color:var(--muted); font-size:14px; line-height:1.6; }
.coming-badge { display:inline-block; margin-top:20px; background:var(--card2); border:1px solid var(--border); border-radius:20px; padding:8px 20px; font-size:13px; color:var(--accent); font-weight:600; }

/* ── PROFILE ── */
.profile-page { padding:16px; }
.profile-card { background:var(--card); border:1px solid var(--border); border-radius:20px; padding:20px; margin-bottom:14px; }
.profile-top { display:flex; align-items:center; gap:14px; }
.avatar-wrap { position:relative; flex-shrink:0; }
.avatar { width:62px; height:62px; border-radius:50%; background:linear-gradient(135deg,var(--accent2),var(--accent)); display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:800; color:#000; overflow:hidden; border:2px solid var(--accent); }
.avatar img { width:100%; height:100%; object-fit:cover; }
.profile-info { flex:1; min-width:0; }
.profile-name { font-size:18px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.profile-handle { font-size:13px; color:var(--muted); margin-top:2px; }
.share-btn { width:38px; height:38px; border-radius:50%; background:var(--card2); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }
.share-btn svg { width:18px; height:18px; color:var(--accent); }
.profile-stats { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px; }
.stat-box { background:var(--card2); border-radius:14px; padding:14px; text-align:center; }
.stat-num { font-size:24px; font-weight:800; color:var(--accent); }
.stat-lbl { font-size:11px; color:var(--muted); margin-top:3px; font-weight:500; }
.add-btn { width:100%; background:linear-gradient(135deg,var(--accent2),var(--accent)); color:#000; font-size:15px; font-weight:700; padding:14px; border-radius:14px; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:16px; }
.add-btn svg { width:20px; height:20px; }
.section-title { font-size:15px; font-weight:700; margin-bottom:10px; }
.my-row { display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--border); border-radius:14px; padding:12px; margin-bottom:8px; cursor:pointer; }
.my-thumb { width:46px; height:46px; border-radius:10px; background:var(--card2); display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; overflow:hidden; }
.my-thumb img { width:100%; height:100%; object-fit:cover; }
.my-info { flex:1; min-width:0; }
.my-title { font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.my-price { font-size:13px; color:var(--accent); font-weight:700; margin-top:2px; }
.del-btn { color:var(--red); padding:6px 8px; font-size:16px; flex-shrink:0; }
.no-ads { text-align:center; color:var(--muted); font-size:14px; padding:30px 0; }

/* ── MODAL ── */
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.8); z-index:300; display:flex; align-items:flex-end; justify-content:center; opacity:0; pointer-events:none; transition:opacity .25s; }
.modal-overlay.open { opacity:1; pointer-events:all; }
.modal { background:var(--card); border-radius:24px 24px 0 0; width:100%; max-width:480px; max-height:92vh; overflow-y:auto; padding:0 0 34px; transform:translateY(50px); transition:transform .28s cubic-bezier(.4,0,.2,1); }
.modal-overlay.open .modal { transform:translateY(0); }
.modal-handle { width:36px; height:4px; background:var(--border); border-radius:2px; margin:14px auto 18px; }
.modal-title { font-size:18px; font-weight:800; padding:0 20px 16px; border-bottom:1px solid var(--border); }
.modal-body { padding:20px 20px 0; }

/* FORM */
.form-label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.8px; font-weight:600; margin-bottom:7px; display:block; }
.form-input,.form-select,.form-textarea { width:100%; background:var(--card2); border:1.5px solid var(--border); border-radius:12px; padding:11px 13px; color:var(--text); font-size:14px; outline:none; margin-bottom:14px; font-family:inherit; transition:border-color .2s; }
.form-input:focus,.form-select:focus,.form-textarea:focus { border-color:var(--accent); }
.form-select option { background:#1c1c1c; }
.form-textarea { resize:none; height:80px; line-height:1.5; }
.photo-zone { border:2px dashed var(--border); border-radius:14px; padding:24px; text-align:center; cursor:pointer; margin-bottom:14px; position:relative; transition:border-color .2s; }
.photo-zone:active { border-color:var(--accent); }
.photo-zone input { position:absolute; inset:0; opacity:0; cursor:pointer; }
.photo-zone-icon { font-size:32px; margin-bottom:8px; }
.photo-zone-txt { color:var(--muted); font-size:13px; }
.photo-preview-img { width:100%; max-height:180px; object-fit:cover; border-radius:12px; margin-bottom:14px; display:none; }
.submit-btn { width:100%; background:linear-gradient(135deg,var(--accent2),var(--accent)); color:#000; font-size:15px; font-weight:800; padding:15px; border-radius:14px; border:none; cursor:pointer; margin-top:6px; transition:opacity .2s; }
.submit-btn:active { opacity:.85; }
.submit-btn:disabled { opacity:.4; }

/* DETAIL */
.detail-img { width:100%; aspect-ratio:4/3; background:var(--card2); display:flex; align-items:center; justify-content:center; font-size:64px; overflow:hidden; }
.detail-img img { width:100%; height:100%; object-fit:cover; }
.detail-body { padding:18px 20px; }
.detail-price { font-size:26px; font-weight:800; color:var(--accent); }
.detail-title { font-size:19px; font-weight:700; margin:6px 0 8px; line-height:1.3; }
.detail-desc { color:var(--muted); font-size:14px; line-height:1.6; margin-bottom:16px; }
.detail-meta { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px; }
.detail-chip { background:var(--card2); border:1px solid var(--border); border-radius:20px; padding:5px 13px; font-size:12px; color:var(--muted); font-weight:500; }
.contact-btn { width:100%; background:var(--green); color:#fff; font-size:15px; font-weight:700; padding:15px; border-radius:14px; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; }
.contact-btn svg { width:18px; height:18px; }
.recs-title { font-size:13px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin:22px 0 10px; }
.recs-scroll { display:flex; gap:10px; overflow-x:auto; scrollbar-width:none; }
.recs-scroll::-webkit-scrollbar { display:none; }
.rec-card { flex-shrink:0; width:120px; background:var(--card2); border-radius:12px; border:1px solid var(--border); overflow:hidden; cursor:pointer; }
.rec-card:active { opacity:.8; }
.rec-img { width:100%; aspect-ratio:1; background:var(--card); display:flex; align-items:center; justify-content:center; font-size:28px; overflow:hidden; }
.rec-img img { width:100%; height:100%; object-fit:cover; }
.rec-body { padding:6px 8px 9px; }
.rec-ttl { font-size:12px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.rec-prc { font-size:12px; color:var(--accent); font-weight:700; margin-top:2px; }

/* TOAST */
.toast { position:fixed; bottom:calc(var(--nav-h)+18px); left:50%; transform:translateX(-50%) translateY(16px); background:rgba(30,30,30,.95); backdrop-filter:blur(10px); border:1px solid var(--border); border-radius:12px; padding:11px 22px; font-size:14px; font-weight:500; z-index:999; opacity:0; transition:all .3s; white-space:nowrap; }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="wrap">

<!-- HEADER -->
<div class="header" id="main-header">
  <div class="header-top">
    <div class="logo"><span class="logo-em">Egypt</span><span class="logo-plain"> Bazar</span></div>
    <div class="lang-switcher">
      <div class="lang-opt active" onclick="setLang('ru')" id="lo-ru">RU</div>
      <div class="lang-opt" onclick="setLang('en')" id="lo-en">EN</div>
      <div class="lang-opt" onclick="setLang('ar')" id="lo-ar">AR</div>
    </div>
  </div>
  <div class="search-box">
    <svg class="search-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input class="search-input" id="search-input" type="text" placeholder="Поиск..." oninput="filterListings()" autofocus>
  </div>
</div>

<!-- PAGE: MARKET -->
<div class="page active" id="page-market">
  <div class="city-tabs">
    <div class="city-tab active" onclick="setCity('all')" id="city-all">Все города</div>
    <div class="city-tab" onclick="setCity('sharm')" id="city-sharm">Шарм</div>
    <div class="city-tab" onclick="setCity('hurghada')" id="city-hurghada">Хургада</div>
  </div>
  <div class="cats-wrap"><div class="cats" id="cats-row"></div></div>
  <div class="listings" id="listings-grid">
    <div class="empty"><div class="empty-icon">⏳</div><div class="empty-txt" id="empty-text">Загрузка...</div></div>
  </div>
</div>

<!-- PAGE: AUCTION -->
<div class="page" id="page-auction">
  <div class="auction-page">
    <div class="coming-icon">🔨</div>
    <div class="coming-title" id="auction-title">Аукцион</div>
    <div class="coming-sub" id="auction-sub">Здесь скоро появятся аукционы.<br>Следите за обновлениями!</div>
    <div class="coming-badge" id="auction-badge">Скоро</div>
  </div>
</div>

<!-- PAGE: PROFILE -->
<div class="page" id="page-profile">
  <div class="profile-page">
    <div class="profile-card">
      <div class="profile-top">
        <div class="avatar-wrap">
          <div class="avatar" id="prof-avatar">?</div>
        </div>
        <div class="profile-info">
          <div class="profile-name" id="prof-name">—</div>
          <div class="profile-handle" id="prof-handle">@username</div>
        </div>
        <div class="share-btn" onclick="shareProfile()" title="Поделиться">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
        </div>
      </div>
      <div class="profile-stats">
        <div class="stat-box"><div class="stat-num" id="stat-active">0</div><div class="stat-lbl" id="stat-active-lbl">Активных</div></div>
        <div class="stat-box"><div class="stat-num" id="stat-total">0</div><div class="stat-lbl" id="stat-total-lbl">Всего</div></div>
      </div>
    </div>
    <button class="add-btn" onclick="openAddModal()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      <span id="add-btn-lbl">Добавить объявление</span>
    </button>
    <div class="section-title" id="my-listings-lbl">Мои объявления</div>
    <div id="my-listings-list"></div>
  </div>
</div>

</div><!-- /wrap -->

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <div class="nav-item active" id="nav-market" onclick="goPage('market')">
    <div class="nav-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    </div>
    <div id="nav-lbl-market">Рынок</div>
  </div>
  <div class="nav-item" id="nav-auction" onclick="goPage('auction')">
    <div class="nav-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 10c-.83 0-1.5-.67-1.5-1.5v-5c0-.83.67-1.5 1.5-1.5s1.5.67 1.5 1.5v5c0 .83-.67 1.5-1.5 1.5z"/><path d="M20.5 10H19V8.5c0-.83.67-1.5 1.5-1.5s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/><path d="M9.5 14c.83 0 1.5.67 1.5 1.5v5c0 .83-.67 1.5-1.5 1.5S8 21.33 8 20.5v-5c0-.83.67-1.5 1.5-1.5z"/><path d="M3.5 14H5v1.5c0 .83-.67 1.5-1.5 1.5S2 16.33 2 15.5 2.67 14 3.5 14z"/><path d="M14 14.5c0-.83.67-1.5 1.5-1.5h5c.83 0 1.5.67 1.5 1.5s-.67 1.5-1.5 1.5h-5c-.83 0-1.5-.67-1.5-1.5z"/><path d="M15.5 19H14v1.5c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5-.67-1.5-1.5-1.5z"/><path d="M10 9.5C10 8.67 9.33 8 8.5 8h-5C2.67 8 2 8.67 2 9.5S2.67 11 3.5 11h5c.83 0 1.5-.67 1.5-1.5z"/><path d="M8.5 5H10V3.5C10 2.67 9.33 2 8.5 2S7 2.67 7 3.5 7.67 5 8.5 5z"/></svg>
    </div>
    <div id="nav-lbl-auction">Аукцион</div>
  </div>
  <div class="nav-item" id="nav-profile" onclick="goPage('profile')">
    <div class="nav-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </div>
    <div id="nav-lbl-profile">Профиль</div>
  </div>
</nav>

<!-- FAB -->
<button class="fab" onclick="openAddModal()" id="fab-btn" title="Добавить">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
</button>

<!-- ADD MODAL -->
<div class="modal-overlay" id="add-modal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="add-modal-title">Новое объявление</div>
    <div class="modal-body">
      <img id="photo-preview-img" class="photo-preview-img" alt="">
      <div class="photo-zone" id="photo-zone">
        <input type="file" accept="image/*" id="photo-input" onchange="previewPhoto(this)">
        <div class="photo-zone-icon">📷</div>
        <div class="photo-zone-txt" id="photo-zone-txt">Добавить фото</div>
      </div>
      <label class="form-label" id="lbl-title">Заголовок *</label>
      <input class="form-input" id="inp-title" type="text" maxlength="100">
      <label class="form-label" id="lbl-desc">Описание</label>
      <textarea class="form-textarea" id="inp-desc" maxlength="500"></textarea>
      <label class="form-label" id="lbl-price">Цена (USD)</label>
      <input class="form-input" id="inp-price" type="number" min="0" placeholder="0">
      <label class="form-label" id="lbl-cat">Категория *</label>
      <select class="form-select" id="inp-cat"></select>
      <label class="form-label" id="lbl-city-f">Город *</label>
      <select class="form-select" id="inp-city">
        <option value="sharm">Sharm el-Sheikh</option>
        <option value="hurghada">Hurghada</option>
      </select>
      <button class="submit-btn" id="submit-btn" onclick="submitListing()">Опубликовать</button>
    </div>
  </div>
</div>

<!-- DETAIL MODAL -->
<div class="modal-overlay" id="detail-modal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="detail-img" id="detail-img-wrap"></div>
    <div class="detail-body">
      <div class="detail-price" id="detail-price"></div>
      <div class="detail-title" id="detail-title"></div>
      <div class="detail-desc" id="detail-desc"></div>
      <div class="detail-meta" id="detail-meta"></div>
      <button class="contact-btn" id="contact-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span id="contact-btn-txt"></span>
      </button>
      <div class="recs-title" id="recs-title"></div>
      <div class="recs-scroll" id="recs-list"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = "";
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

let lang = "ru", currentCity = "all", currentCat = "all";
let allListings = [], currentPage = "market";
let tgUser = tg?.initDataUnsafe?.user || null;

/* ── i18n ── */
const T = {
  ru: {
    search:"Поиск...", all_cities:"Все города", sharm:"Шарм", hurghada:"Хургада",
    new_listing:"Новое объявление", lbl_title:"Заголовок *", lbl_desc:"Описание",
    lbl_price:"Цена (USD)", lbl_cat:"Категория *", lbl_city:"Город *",
    photo_upload:"Добавить фото", publish:"Опубликовать", contact:"Написать продавцу",
    empty:"Объявлений нет", free:"Бесплатно",
    nav_market:"Рынок", nav_auction:"Аукцион", nav_profile:"Профиль",
    auction_title:"Аукцион", auction_sub:"Здесь скоро появятся аукционы.\nСледите за обновлениями!",
    auction_badge:"Скоро", add_listing:"Добавить объявление",
    my_listings:"Мои объявления", no_listings:"У вас пока нет объявлений",
    recs_title:"Похожие объявления", del_confirm:"Удалить объявление?",
    stat_active:"Активных", stat_total:"Всего",
    cats:{ all:"Все", clothes:"Одежда", food:"Продукты", electronics:"Электроника",
           furniture:"Мебель", services:"Услуги", alcohol:"Алкоголь", housing:"Жильё" }
  },
  en: {
    search:"Search...", all_cities:"All cities", sharm:"Sharm", hurghada:"Hurghada",
    new_listing:"New Listing", lbl_title:"Title *", lbl_desc:"Description",
    lbl_price:"Price (USD)", lbl_cat:"Category *", lbl_city:"City *",
    photo_upload:"Add photo", publish:"Publish", contact:"Contact seller",
    empty:"No listings found", free:"Free",
    nav_market:"Market", nav_auction:"Auction", nav_profile:"Profile",
    auction_title:"Auction", auction_sub:"Auctions coming soon.\nStay tuned!",
    auction_badge:"Coming soon", add_listing:"Add listing",
    my_listings:"My listings", no_listings:"You have no listings yet",
    recs_title:"Similar listings", del_confirm:"Delete this listing?",
    stat_active:"Active", stat_total:"Total",
    cats:{ all:"All", clothes:"Clothes", food:"Food", electronics:"Electronics",
           furniture:"Furniture", services:"Services", alcohol:"Alcohol", housing:"Housing" }
  },
  ar: {
    search:"بحث...", all_cities:"كل المدن", sharm:"شرم", hurghada:"الغردقة",
    new_listing:"إعلان جديد", lbl_title:"العنوان *", lbl_desc:"الوصف",
    lbl_price:"السعر (USD)", lbl_cat:"الفئة *", lbl_city:"المدينة *",
    photo_upload:"إضافة صورة", publish:"نشر", contact:"تواصل مع البائع",
    empty:"لا توجد إعلانات", free:"مجاني",
    nav_market:"السوق", nav_auction:"مزاد", nav_profile:"الملف",
    auction_title:"مزاد", auction_sub:"قريباً ستظهر المزادات هنا",
    auction_badge:"قريباً", add_listing:"إضافة إعلان",
    my_listings:"إعلاناتي", no_listings:"ليس لديك إعلانات بعد",
    recs_title:"إعلانات مشابهة", del_confirm:"حذف هذا الإعلان؟",
    stat_active:"نشط", stat_total:"المجموع",
    cats:{ all:"الكل", clothes:"ملابس", food:"طعام", electronics:"إلكترونيات",
           furniture:"أثاث", services:"خدمات", alcohol:"كحول", housing:"سكن" }
  }
};
const t = k => { const keys=k.split("."); let v=T[lang]; for(const x of keys) v=v?.[x]; return v||k; };

const CAT_KEYS = ["all","clothes","food","electronics","furniture","services","alcohol","housing"];
const CAT_EMOJI = { all:"✦", clothes:"👗", food:"🥑", electronics:"📱", furniture:"🛋", services:"🔧", alcohol:"🍾", housing:"🏠" };

function setLang(l) {
  lang = l;
  document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
  ["ru","en","ar"].forEach(x => document.getElementById(`lo-${x}`).classList.toggle("active", x===l));
  applyLang();
}

function applyLang() {
  document.getElementById("search-input").placeholder = t("search");
  document.getElementById("city-all").textContent = t("all_cities");
  document.getElementById("city-sharm").textContent = t("sharm");
  document.getElementById("city-hurghada").textContent = t("hurghada");
  document.getElementById("add-modal-title").textContent = t("new_listing");
  document.getElementById("lbl-title").textContent = t("lbl_title");
  document.getElementById("lbl-desc").textContent = t("lbl_desc");
  document.getElementById("lbl-price").textContent = t("lbl_price");
  document.getElementById("lbl-cat").textContent = t("lbl_cat");
  document.getElementById("lbl-city-f").textContent = t("lbl_city");
  document.getElementById("photo-zone-txt").textContent = t("photo_upload");
  document.getElementById("submit-btn").textContent = t("publish");
  document.getElementById("nav-lbl-market").textContent = t("nav_market");
  document.getElementById("nav-lbl-auction").textContent = t("nav_auction");
  document.getElementById("nav-lbl-profile").textContent = t("nav_profile");
  document.getElementById("auction-title").textContent = t("auction_title");
  document.getElementById("auction-sub").textContent = t("auction_sub");
  document.getElementById("auction-badge").textContent = t("auction_badge");
  document.getElementById("add-btn-lbl").textContent = t("add_listing");
  document.getElementById("my-listings-lbl").textContent = t("my_listings");
  document.getElementById("stat-active-lbl").textContent = t("stat_active");
  document.getElementById("stat-total-lbl").textContent = t("stat_total");
  buildCats(); buildCatSelect(); renderListings(filterData());
  if (currentPage==="profile") loadProfile();
}

function goPage(page) {
  currentPage = page;
  ["market","auction","profile"].forEach(p => {
    document.getElementById(`page-${p}`).classList.toggle("active", p===page);
    document.getElementById(`nav-${p}`).classList.toggle("active", p===page);
  });
  document.getElementById("main-header").style.display = page==="market" ? "" : "none";
  document.getElementById("fab-btn").style.display = page==="market" ? "" : "none";
  if (page==="profile") loadProfile();
}

function buildCats() {
  const row = document.getElementById("cats-row"); row.innerHTML = "";
  CAT_KEYS.forEach(k => {
    const btn = document.createElement("div");
    btn.className = "cat-btn" + (currentCat===k?" active":"");
    btn.innerHTML = `<span>${CAT_EMOJI[k]}</span><span>${t(`cats.${k}`)}</span>`;
    btn.onclick = () => setCategory(k);
    row.appendChild(btn);
  });
}
function buildCatSelect() {
  const sel = document.getElementById("inp-cat"); sel.innerHTML = "";
  CAT_KEYS.filter(k=>k!=="all").forEach(k => {
    const o = document.createElement("option");
    o.value = k; o.textContent = `${CAT_EMOJI[k]} ${t(`cats.${k}`)}`;
    sel.appendChild(o);
  });
}
function setCity(city) {
  currentCity = city;
  ["all","sharm","hurghada"].forEach(c => document.getElementById(`city-${c}`).classList.toggle("active", c===city));
  renderListings(filterData());
}
function setCategory(cat) { currentCat = cat; buildCats(); renderListings(filterData()); }
function filterData() {
  const q = document.getElementById("search-input").value.toLowerCase();
  return allListings.filter(l => {
    if (currentCity!=="all" && l.city!==currentCity) return false;
    if (currentCat!=="all" && l.category!==currentCat) return false;
    if (q && !l.title.toLowerCase().includes(q) && !(l.description||"").toLowerCase().includes(q)) return false;
    return true;
  });
}
function filterListings() { renderListings(filterData()); }
function esc(s) { return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function priceStr(l) { return l.price && l.price > 0 ? `$${l.price}` : t("free"); }
function cityName(c) { return c==="sharm" ? (lang==="ru"?"Шарм-эль-Шейх":"Sharm el-Sheikh") : (lang==="ru"?"Хургада":"Hurghada"); }

function renderListings(data) {
  const grid = document.getElementById("listings-grid");
  if (!data.length) { grid.innerHTML=`<div class="empty"><div class="empty-icon">🏪</div><div class="empty-txt">${t("empty")}</div></div>`; return; }
  grid.innerHTML = data.map(l => `
    <div class="card" onclick="openDetail(${l.id})">
      <div class="card-img">${l.photo_path?`<img src="${l.photo_path}" loading="lazy">`:`<span>${CAT_EMOJI[l.category]||"📦"}</span>`}</div>
      <div class="card-badge">${t(`cats.${l.category}`)}</div>
      <div class="card-body">
        <div class="card-title">${esc(l.title)}</div>
        <div class="card-price">${priceStr(l)}</div>
        <div class="card-city">📍 ${l.city==="sharm"?"Sharm":"Hurghada"}</div>
      </div>
    </div>`).join("");
}

async function loadListings() {
  try { const res=await fetch(`${API}/api/listings`); allListings=await res.json(); renderListings(filterData()); }
  catch(e) { document.getElementById("listings-grid").innerHTML=`<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-txt">Ошибка соединения</div></div>`; }
}

async function openDetail(id) {
  try {
    const res=await fetch(`${API}/api/listings/${id}`); const l=await res.json();
    document.getElementById("detail-img-wrap").innerHTML = l.photo_path
      ? `<img src="${l.photo_path}" alt="">` : `<span>${CAT_EMOJI[l.category]||"📦"}</span>`;
    document.getElementById("detail-price").textContent = priceStr(l);
    document.getElementById("detail-title").textContent = l.title;
    document.getElementById("detail-desc").textContent = l.description||"";
    document.getElementById("detail-meta").innerHTML =
      `<span class="detail-chip">${CAT_EMOJI[l.category]} ${t(`cats.${l.category}`)}</span>
       <span class="detail-chip">📍 ${cityName(l.city)}</span>`;
    document.getElementById("contact-btn-txt").textContent = t("contact");
    document.getElementById("contact-btn").onclick = () => { if(tg) tg.close(); };
    const recs = allListings.filter(x=>x.id!==id&&(x.category===l.category||x.city===l.city)).slice(0,8);
    document.getElementById("recs-title").textContent = recs.length ? t("recs_title") : "";
    document.getElementById("recs-list").innerHTML = recs.map(r=>`
      <div class="rec-card" onclick="closeModal('detail-modal');setTimeout(()=>openDetail(${r.id}),220)">
        <div class="rec-img">${r.photo_path?`<img src="${r.photo_path}" loading="lazy">`:`<span>${CAT_EMOJI[r.category]||"📦"}</span>`}</div>
        <div class="rec-body"><div class="rec-ttl">${esc(r.title)}</div><div class="rec-prc">${priceStr(r)}</div></div>
      </div>`).join("");
    document.getElementById("detail-modal").classList.add("open");
  } catch(e) {}
}

function loadProfile() {
  if (tgUser) {
    const name = [tgUser.first_name, tgUser.last_name].filter(Boolean).join(" ");
    const avatarEl = document.getElementById("prof-avatar");
    if (tgUser.photo_url) {
      avatarEl.innerHTML = `<img src="${tgUser.photo_url}" alt="">`;
    } else {
      avatarEl.textContent = (name[0]||"?").toUpperCase();
    }
    document.getElementById("prof-name").textContent = name||"—";
    document.getElementById("prof-handle").textContent = tgUser.username ? `@${tgUser.username}` : `ID: ${tgUser.id}`;
  }
  const uid = tgUser?.id||0;
  const myActive = allListings.filter(l=>l.user_id===uid&&l.is_active!==0);
  document.getElementById("stat-active").textContent = myActive.length;
  document.getElementById("stat-total").textContent = allListings.filter(l=>l.user_id===uid).length;
  const list = document.getElementById("my-listings-list");
  if (!myActive.length) { list.innerHTML=`<div class="no-ads">${t("no_listings")}</div>`; return; }
  list.innerHTML = myActive.map(l=>`
    <div class="my-row">
      <div class="my-thumb" onclick="openDetail(${l.id})">${l.photo_path?`<img src="${l.photo_path}">`:`<span>${CAT_EMOJI[l.category]||"📦"}</span>`}</div>
      <div class="my-info" onclick="openDetail(${l.id})">
        <div class="my-title">${esc(l.title)}</div>
        <div class="my-price">${priceStr(l)}</div>
      </div>
      <div class="del-btn" onclick="deleteListing(${l.id})">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
      </div>
    </div>`).join("");
}

function shareProfile() {
  const name = document.getElementById("prof-name").textContent;
  if (navigator.share) {
    navigator.share({ title:"Egypt Bazar", text:`Смотри профиль ${name} на Egypt Bazar`, url:"https://bazaregypt.store" });
  } else if (tg) {
    tg.openTelegramLink(`https://t.me/share/url?url=https://bazaregypt.store&text=Egypt Bazar — маркетплейс Шарм и Хургада`);
  }
}

async function deleteListing(id) {
  if (!confirm(t("del_confirm"))) return;
  try { await fetch(`${API}/api/listings/${id}?user_id=${tgUser?.id||0}`,{method:"DELETE"}); await loadListings(); loadProfile(); showToast("🗑 Удалено"); } catch(e) { showToast("❌ Ошибка"); }
}

function openAddModal() { buildCatSelect(); document.getElementById("add-modal").classList.add("open"); }
function closeModal(id) { document.getElementById(id).classList.remove("open"); }
document.getElementById("add-modal").addEventListener("click",e=>{if(e.target===e.currentTarget)closeModal("add-modal");});
document.getElementById("detail-modal").addEventListener("click",e=>{if(e.target===e.currentTarget)closeModal("detail-modal");});

function previewPhoto(input) {
  const file=input.files[0]; if(!file) return;
  const p=document.getElementById("photo-preview-img"); p.src=URL.createObjectURL(file); p.style.display="block";
  document.getElementById("photo-zone").style.display="none";
}

async function submitListing() {
  const title=document.getElementById("inp-title").value.trim();
  if(!title){showToast("⚠️ Введите заголовок");return;}
  const btn=document.getElementById("submit-btn"); btn.disabled=true;
  const fd=new FormData();
  fd.append("user_id",tgUser?.id||0); fd.append("title",title);
  fd.append("description",document.getElementById("inp-desc").value);
  fd.append("price",document.getElementById("inp-price").value||0);
  fd.append("currency","USD");
  fd.append("category",document.getElementById("inp-cat").value);
  fd.append("city",document.getElementById("inp-city").value);
  const photo=document.getElementById("photo-input").files[0];
  if(photo) fd.append("photo",photo);
  try {
    const res=await fetch(`${API}/api/listings`,{method:"POST",body:fd});
    if(res.ok){closeModal("add-modal");resetForm();loadListings();showToast("✅ Опубликовано!");}
    else showToast("❌ Ошибка");
  } catch(e){showToast("❌ Ошибка соединения");}
  btn.disabled=false;
}

function resetForm() {
  ["inp-title","inp-desc","inp-price"].forEach(id=>document.getElementById(id).value="");
  document.getElementById("photo-input").value="";
  document.getElementById("photo-preview-img").style.display="none";
  document.getElementById("photo-zone").style.display="";
}

function showToast(msg) {
  const el=document.getElementById("toast"); el.textContent=msg; el.classList.add("show");
  setTimeout(()=>el.classList.remove("show"),2500);
}

buildCats(); buildCatSelect(); applyLang(); loadListings();
document.getElementById("search-input").focus();
</script>
</body>
</html>
